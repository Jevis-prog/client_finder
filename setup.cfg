[flake8]
no-isort-config = true
max-line-length = 100
ignore = D100, D104,D106,D107,D401,W503
max-complexity = 10
exclude = .git,__pycache__,.venv, venv, client, migrations
per-file-ignores =
    */__init__.py: F401

[isort]
old_finders = true
lines_after_imports = 2
known_first_party = bot
skip = .venv, venv, migrations
line_length = 100
src_paths = bot,tests
multi_line_output = 3
include_trailing_comma = true

[pep8]
exclude = .venv, venv
aggressive = 1
experimental = 1
in-place = 1
recursive = 1

[tool:pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
