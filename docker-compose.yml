services:
  app:
    build: ./backend
    env_file:
      - .env
    volumes:
      - ./sessions:/app/sessions
    environment:
      - PG_HOST=db
      - PG_PORT=5432
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    build: ./backend
    env_file:
      - .env
    environment:
      - PG_HOST=db
      - PG_PORT=5432
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api
  db:
    image: postgres:14-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_INITDB_ARGS=--locale=ru_RU.UTF-8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    build: ./backend
    env_file:
      - .env
    environment:
      - PG_HOST=db
      - PG_PORT=5432
      - PGPASSWORD=${POSTGRES_PASSWORD}
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
