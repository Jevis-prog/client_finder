name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync Project
        shell: bash
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.mypy_cache/' \
            --exclude '.env' \
            --exclude 'sessions/' \
            --exclude 'logs/' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/client_finder/"

      - name: Write Env File
        shell: bash
        run: |
          rsync -az ./deploy/dev.env "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/client_finder/.env"
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "cat >> /opt/client_finder/.env <<'EOF'
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          PG_PASSWORD=${{ secrets.PG_PASSWORD }}
          API_ID=${{ secrets.API_ID }}
          API_HASH=${{ secrets.API_HASH }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          OPEN_ROUTER_API_KEY=${{ secrets.OPEN_ROUTER_API_KEY }}
          EOF"

      - name: Deploy Containers
        shell: bash
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
            set -e
            mkdir -p /opt/client_finder/sessions /opt/client_finder/logs
            cd /opt/client_finder
            docker compose up -d --build db migrate app
          '
