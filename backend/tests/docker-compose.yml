version: '3.3'
services:
  db:
    container_name: bot_analyzer_postgres_for_tests
    image: postgres:14.3
    restart: always
    networks:
      - test_bot_analyzer_network
    environment:
      POSTGRES_DB: tg_bot_db
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '5432:5432'


networks:
  test_bot_analyzer_network:
